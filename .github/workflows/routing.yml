name: Dynamic routing fixtures
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline-fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Bash entrypoint (no inference)
        if: runner.os != 'Windows'
        shell: bash
        run: bash tests/test-model-routing-discovery.sh
      - name: PowerShell fixtures (no inference)
        shell: pwsh
        run: ./tests/test-dynamic-model-routing.ps1
      - name: Verify exact payload and zero repository writes
        shell: pwsh
        run: |
          git rev-parse HEAD
          Get-FileHash scripts/dynamic-model-routing.psm1 -Algorithm SHA256
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@(git status --porcelain --untracked-files=all).Count -ne 0) { throw 'Offline tests changed the repository.' }
